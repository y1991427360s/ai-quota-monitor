<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 配额与 Codex 监控 - SEN 工具箱</title>
  <style>
    :root {
      --bg: #090d16;
      --card-bg: rgba(18, 24, 38, 0.85);
      --card-border: rgba(255, 255, 255, 0.08);
      --primary: #38bdf8;
      --primary-hover: #0284c7;
      --accent: #818cf8;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
      --radius: 14px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      background-image: 
        radial-gradient(at 0% 0%, rgba(56, 189, 248, 0.12) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(129, 140, 248, 0.12) 0px, transparent 50%);
      background-attachment: fixed;
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      min-height: 100vh;
      padding: 24px 16px;
    }

    .container {
      max-width: 1080px;
      margin: 0 auto;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--card-border);
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 38px;
      height: 38px;
      border-radius: 10px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text);
      text-decoration: none;
      transition: all 0.2s;
    }

    .back-btn:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: var(--primary);
    }

    h1 {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .subtitle {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .header-actions {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      border-radius: 9px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid transparent;
      transition: all 0.2s;
      text-decoration: none;
    }

    .btn-primary {
      background: var(--primary);
      color: #0b1120;
    }

    .btn-primary:hover {
      background: var(--primary-hover);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.05);
      border-color: var(--card-border);
      color: var(--text);
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.1);
    }

    /* 选项卡 Tab 控制器 */
    .tabs-bar {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      background: rgba(0, 0, 0, 0.25);
      padding: 4px;
      border-radius: 12px;
      border: 1px solid var(--card-border);
      width: fit-content;
    }

    .tab-btn {
      padding: 8px 18px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
      background: transparent;
      border: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s;
    }

    .tab-btn.active {
      background: var(--card-bg);
      color: var(--primary);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(56, 189, 248, 0.2);
    }

    .account-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(330px, 1fr));
      gap: 16px;
    }

    .account-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 18px;
      backdrop-filter: blur(12px);
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .account-card:hover {
      border-color: rgba(56, 189, 248, 0.4);
      transform: translateY(-2px);
    }

    .account-card.active-account {
      border-color: var(--primary);
      box-shadow: 0 0 16px rgba(56, 189, 248, 0.15);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    .account-email {
      font-size: 15px;
      font-weight: 600;
      word-break: break-all;
    }

    .badge {
      display: inline-block;
      font-size: 11px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 9999px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      white-space: nowrap;
    }

    .badge-active {
      background: rgba(56, 189, 248, 0.2);
      color: var(--primary);
      border: 1px solid rgba(56, 189, 248, 0.4);
    }

    .badge-normal {
      background: rgba(16, 185, 129, 0.2);
      color: var(--success);
      border: 1px solid rgba(16, 185, 129, 0.4);
    }

    .group-section {
      background: rgba(0, 0, 0, 0.35);
      border-radius: 10px;
      padding: 14px 16px;
      margin-bottom: 12px;
      border: 1px solid rgba(255, 255, 255, 0.04);
    }

    .group-title {
      font-size: 13px;
      font-weight: 700;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .limit-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .limit-row:last-child {
      margin-bottom: 0;
    }

    .limit-label {
      font-size: 13px;
      font-weight: 500;
      color: #e2e8f0;
    }

    .limit-sub {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 1px;
    }

    .limit-value-box {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .limit-pct {
      font-size: 14px;
      font-weight: 700;
      font-family: monospace;
    }

    .ring-indicator {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      border: 2.5px solid;
    }

    .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 10px;
      padding-top: 12px;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
      font-size: 12px;
      color: var(--text-muted);
    }

    .btn-card {
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 12px;
      transition: color 0.2s;
    }

    .btn-card:hover {
      color: var(--danger);
    }

    .btn-switch {
      background: rgba(56, 189, 248, 0.1);
      border: 1px solid rgba(56, 189, 248, 0.2);
      color: var(--primary);
      padding: 3px 8px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 11px;
      transition: all 0.2s;
    }

    .btn-switch:hover {
      background: rgba(56, 189, 248, 0.25);
    }

    /* Codex 专用样式看板 */
    .stat-row-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 14px;
      margin-bottom: 20px;
    }

    .stat-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 16px 20px;
    }

    .stat-num {
      font-size: 26px;
      font-weight: 800;
      color: var(--primary);
      margin-top: 4px;
      font-family: monospace;
    }

    .table-container {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      overflow-x: auto;
      margin-bottom: 20px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
      text-align: left;
    }

    th, td {
      padding: 12px 16px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    th {
      color: var(--text-muted);
      font-weight: 600;
      background: rgba(0, 0, 0, 0.2);
    }

    tr:last-child td {
      border-bottom: none;
    }

    /* Modal */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(6px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 16px;
    }

    .modal-overlay.show {
      display: flex;
    }

    .modal {
      background: #111827;
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      max-width: 540px;
      width: 100%;
      padding: 24px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
    }

    .modal-title {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 12px;
    }

    .step-box {
      background: rgba(255, 255, 255, 0.03);
      border-radius: 8px;
      padding: 12px 14px;
      margin-bottom: 14px;
      font-size: 13px;
      line-height: 1.6;
      color: #cbd5e1;
    }

    .step-box ol {
      margin-left: 18px;
    }

    .input-field {
      width: 100%;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 10px 12px;
      color: white;
      font-size: 13px;
      margin-bottom: 16px;
      outline: none;
      transition: border-color 0.2s;
    }

    .input-field:focus {
      border-color: var(--primary);
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
    }

    .loading-state {
      text-align: center;
      padding: 48px 0;
      color: var(--text-muted);
      font-size: 14px;
    }

    .empty-state {
      text-align: center;
      padding: 48px 20px;
      background: var(--card-bg);
      border: 1px dashed var(--card-border);
      border-radius: var(--radius);
      margin-top: 12px;
    }

    .empty-state h3 {
      font-size: 16px;
      margin-bottom: 8px;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="header-left">
        <a href="/" class="back-btn" title="返回工具箱">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
        </a>
        <div>
          <h1>AI 额度与模型监控</h1>
          <div class="subtitle">OpenAI Codex / ChatGPT Plus 及 Google Antigravity 多模型配额实时看板</div>
        </div>
      </div>
      <div class="header-actions">
        <button class="btn btn-secondary" onclick="triggerTestWechatPush()" title="发送测试推送至企业微信私人助理">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
          微信推送测试
        </button>
        <button class="btn btn-secondary" onclick="fetchActiveTab(true)">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/><path d="M16 16h5v5"/></svg>
          刷新
        </button>
        <button class="btn btn-primary" id="addGoogleBtn" onclick="openAddModal()">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
          添加谷歌账号
        </button>
      </div>
    </header>

    <!-- Tab 导航 -->
    <div class="tabs-bar">
      <button class="tab-btn active" id="tabCodexBtn" onclick="switchTab('codex')">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></svg>
        Codex / Plus 额度
      </button>
      <button class="tab-btn" id="tabGoogleBtn" onclick="switchTab('google')">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="m4.93 4.93 4.24 4.24"/><path d="m14.83 9.17 4.24-4.24"/><path d="m14.83 14.83 4.24 4.24"/><path d="m9.17 14.83-4.24 4.24"/></svg>
        Google Antigravity
      </button>
    </div>

    <!-- 容器内容 -->
    <div id="contentArea">
      <div class="loading-state">正在拉取配额数据...</div>
    </div>
  </div>

  <!-- 添加 Google 账号 Modal -->
  <div class="modal-overlay" id="addModal">
    <div class="modal">
      <div class="modal-title">添加 Google 账号授权</div>
      <div class="step-box">
        <ol>
          <li>点击下方<b>「打开谷歌授权页」</b>登录你的 Google AI 账号；</li>
          <li>在 Google 页面完成权限勾选并点击继续；</li>
          <li>页面将跳转到一个无法连接的 <code>http://127.0.0.1:8085/callback?code=...</code> 页面；</li>
          <li><b>复制浏览器地址栏的完整网址</b>，粘贴到下方输入框，点击完成绑定。</li>
        </ol>
      </div>
      <div style="margin-bottom: 14px;">
        <button class="btn btn-secondary" style="width: 100%; justify-content: center;" onclick="openGoogleAuth()">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
          第 1 步：点击打开谷歌官方授权页
        </button>
      </div>
      <div>
        <label style="display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 6px;">第 2 步：粘贴跳转后的完整网址</label>
        <input type="text" id="redirectUrlInput" class="input-field" placeholder="http://127.0.0.1:8085/callback?code=4/0A...&scope=...">
      </div>
      <div class="modal-actions">
        <button class="btn btn-secondary" onclick="closeAddModal()">取消</button>
        <button class="btn btn-primary" id="submitAuthBtn" onclick="submitAuthCode()">完成绑定</button>
      </div>
    </div>
  </div>

  <script>
    let currentTab = "codex";
    let authUrl = "";

    function switchTab(tab) {
      currentTab = tab;
      document.getElementById("tabCodexBtn").classList.toggle("active", tab === "codex");
      document.getElementById("tabGoogleBtn").classList.toggle("active", tab === "google");
      document.getElementById("addGoogleBtn").style.display = (tab === "google") ? "inline-flex" : "none";
      fetchActiveTab();
    }

    function fetchActiveTab(forceRefresh = false) {
      if (currentTab === "codex") {
        fetchCodexData();
      } else {
        fetchGoogleData(forceRefresh);
      }
    }

    async function triggerTestWechatPush() {
      try {
        const res = await fetch("/quota/api/codex/test-push", {method: "POST"});
        const data = await res.json();
        if (data.errcode === 0) {
          alert("测试消息已成功推送至企业微信「私人助理」！");
        } else {
          alert("推送返回: " + JSON.stringify(data));
        }
      } catch (e) {
        alert("请求异常: " + e.message);
      }
    }

    // ==================== Codex 渲染 ====================
    async function fetchCodexData() {
      const area = document.getElementById("contentArea");
      area.innerHTML = '<div class="loading-state">正在查询 Codex 5h 活跃与网关状态...</div>';
      try {
        const res = await fetch("/quota/api/codex");
        const data = await res.json();
        renderCodexView(data);
      } catch (e) {
        area.innerHTML = `<div class="empty-state" style="color: var(--danger);">加载 Codex 数据失败：${e.message}</div>`;
      }
    }

    function renderCodexView(data) {
      const area = document.getElementById("contentArea");
      const u5h = data.key_usage_5h || {};
      const u24h = data.key_usage_24h || {};
      const backends = data.active_backends || [];
      const models = data.models_breakdown || [];

      let html = `
        <div class="stat-row-grid">
          <div class="stat-card">
            <div style="font-size: 12px; color: var(--text-muted);">Codex 5 小时请求数</div>
            <div class="stat-num">${u5h.total_requests || 0} <span style="font-size: 13px; color: var(--text-muted); font-weight: normal;">次</span></div>
            <div style="font-size: 11px; color: var(--text-muted); margin-top: 4px;">滑窗请求负载</div>
          </div>
          <div class="stat-card">
            <div style="font-size: 12px; color: var(--text-muted);">5 小时 Token 总计</div>
            <div class="stat-num" style="color: #38bdf8;">${formatTokens((u5h.total_input || 0) + (u5h.total_output || 0))}</div>
            <div style="font-size: 11px; color: var(--text-muted); margin-top: 4px;">输入 ${formatTokens(u5h.total_input || 0)} / 输出 ${formatTokens(u5h.total_output || 0)}</div>
          </div>
          <div class="stat-card">
            <div style="font-size: 12px; color: var(--text-muted);">Prompt 缓存读取</div>
            <div class="stat-num" style="color: #22c55e;">${formatTokens(u5h.total_cache_read || 0)}</div>
            <div style="font-size: 11px; color: var(--text-muted); margin-top: 4px;">省流缓存率 ${(u5h.total_cache_read ? ((u5h.total_cache_read / (u5h.total_cache_read + (u5h.total_input||1)))*100).toFixed(1) : 0)}%</div>
          </div>
          <div class="stat-card">
            <div style="font-size: 12px; color: var(--text-muted);">24 小时累计调用</div>
            <div class="stat-num" style="color: #818cf8;">${u24h.total_requests || 0} <span style="font-size: 13px; color: var(--text-muted); font-weight: normal;">次</span></div>
            <div style="font-size: 11px; color: var(--text-muted); margin-top: 4px;">总 Tokens: ${formatTokens((u24h.total_input||0) + (u24h.total_output||0))}</div>
          </div>
        </div>

        <div style="margin: 24px 0 12px; display: flex; justify-content: space-between; align-items: center;">
          <h3 style="font-size: 16px; font-weight: 700;">🟢 活跃与调度中的 OpenAI / Plus 后端</h3>
          <span style="font-size: 12px; color: var(--text-muted);">由 sub2API 驱动负载调度</span>
        </div>

        <div class="table-container">
          <table>
            <thead>
              <tr>
                <th>账号名称</th>
                <th>类型 / Plan</th>
                <th>优先级</th>
                <th>倍率</th>
                <th>最近调用</th>
                <th>限额 / 状态</th>
              </tr>
            </thead>
            <tbody>
      `;

      if (backends.length === 0) {
        html += `<tr><td colspan="6" style="text-align:center;color:var(--text-muted);">暂无活跃账号</td></tr>`;
      } else {
        for (const b of backends) {
          const isLimited = Boolean(b.rate_limited_at);
          html += `
            <tr>
              <td style="font-weight: 600;">${b.name || '未命名'}</td>
              <td><span class="badge ${b.plan === 'plus' ? 'badge-active' : 'badge-normal'}">${b.plan ? b.plan.toUpperCase() : b.type}</span></td>
              <td>${b.priority || 1}</td>
              <td style="font-family: monospace;">${b.rate_multiplier}x</td>
              <td style="font-size: 12px; color: var(--text-muted);">${formatTime(b.last_used_at)}</td>
              <td>
                ${isLimited ? '<span style="color: var(--danger); font-size: 11px;">⚠️ 曾触发 429</span>' : '<span style="color: var(--success); font-size: 11px;">● 活跃就绪</span>'}
              </td>
            </tr>
          `;
        }
      }

      html += `
            </tbody>
          </table>
        </div>

        <div style="margin: 20px 0 12px;">
          <h3 style="font-size: 16px; font-weight: 700;">📊 过去 24 小时模型调用分布</h3>
        </div>

        <div class="table-container">
          <table>
            <thead>
              <tr>
                <th>模型名称</th>
                <th>调用次数</th>
                <th>输入 Tokens</th>
                <th>输出 Tokens</th>
              </tr>
            </thead>
            <tbody>
      `;

      if (models.length === 0) {
        html += `<tr><td colspan="4" style="text-align:center;color:var(--text-muted);">暂无调用分布记录</td></tr>`;
      } else {
        for (const m of models) {
          html += `
            <tr>
              <td style="font-family: monospace; font-weight: 600; color: var(--primary);">${m.model}</td>
              <td>${m.count} 次</td>
              <td style="font-family: monospace;">${formatTokens(m.in_tok || 0)}</td>
              <td style="font-family: monospace;">${formatTokens(m.out_tok || 0)}</td>
            </tr>
          `;
        }
      }

      html += `
            </tbody>
          </table>
        </div>
      `;

      area.innerHTML = html;
    }

    function formatTokens(num) {
      if (!num) return "0";
      if (num > 1000000) return (num / 1000000).toFixed(2) + "M";
      if (num > 1000) return (num / 1000).toFixed(1) + "k";
      return num.toString();
    }

    function formatTime(isoStr) {
      if (!isoStr) return "从未调用";
      try {
        const d = new Date(isoStr);
        return d.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit', second:'2-digit'});
      } catch (e) {
        return isoStr;
      }
    }

    // ==================== Google 渲染 ====================
    async function fetchGoogleData(forceRefresh = false) {
      const area = document.getElementById("contentArea");
      area.innerHTML = '<div class="loading-state">正在查询最新 Google 配额状态...</div>';
      try {
        const res = await fetch(`/quota/api/quota?refresh=${forceRefresh ? 'true' : 'false'}`);
        const data = await res.json();
        if (Array.isArray(data)) {
          renderGoogleCards(data);
        } else {
          const statusRes = await fetch("/quota/api/status");
          const statusData = await statusRes.json();
          renderGoogleCards(statusData.accounts || []);
        }
      } catch (err) {
        area.innerHTML = `<div class="empty-state" style="color: var(--danger);">加载失败：${err.message}</div>`;
      }
    }

    function getColor(pct) {
      if (pct === undefined || pct === null) return "var(--text-muted)";
      if (pct > 50) return "#22c55e";
      if (pct > 20) return "#f59e0b";
      return "#ef4444";
    }

    function formatCountdown(isoString) {
      if (!isoString) return "";
      try {
        const target = new Date(isoString).getTime();
        const diff = target - Date.now();
        if (diff <= 0) return "已就绪";
        const mins = Math.floor(diff / (60 * 1000));
        const hours = Math.floor(mins / 60);
        const remMins = mins % 60;
        if (hours > 0) {
          return `${hours}h ${remMins}m`;
        }
        return `${remMins}m`;
      } catch (e) {
        return "";
      }
    }

    function renderGoogleCards(accountsData) {
      const area = document.getElementById("contentArea");
      if (!accountsData || accountsData.length === 0) {
        area.innerHTML = `
          <div class="empty-state">
            <h3>尚未配置任何 Google 账号</h3>
            <p style="color: var(--text-muted); font-size: 13px; margin: 10px 0 16px;">
              点击上方「添加谷歌账号」，授权后即可在此实时监控各账号额度。
            </p>
            <button class="btn btn-primary" onclick="openAddModal()">立即添加第一个账号</button>
          </div>
        `;
        return;
      }

      let html = '<div class="account-grid">';
      for (const item of accountsData) {
        const email = item.email || "未知账号";
        const isActive = item.isActive;
        const groups = item.groups || [];
        const isError = item.status === "error";

        html += `
          <div class="account-card ${isActive ? 'active-account' : ''}">
            <div class="card-header">
              <div>
                <div class="account-email">${email}</div>
                <div style="font-size: 11px; color: var(--text-muted); margin-top: 2px;">
                  ${item.tier || 'Google AI Pro'}
                </div>
              </div>
              <span class="badge ${isActive ? 'badge-active' : 'badge-normal'}">
                ${isActive ? '活跃账号' : '待命'}
              </span>
            </div>
        `;

        if (isError) {
          html += `
            <div style="padding: 12px; background: rgba(239, 68, 68, 0.1); border-radius: 8px; color: var(--danger); font-size: 12px; margin: 10px 0;">
              获取异常: ${item.error || 'Token可能已失效'}
            </div>
          `;
        } else if (groups.length > 0) {
          for (const g of groups) {
            const pct = g.percentage !== undefined ? g.percentage : 100;
            const color = getColor(pct);
            const countdown = formatCountdown(g.resetTime);

            html += `
              <div class="group-section">
                <div class="group-title">
                  <span>${g.groupName}</span>
                </div>
                
                <div class="limit-row">
                  <div>
                    <div class="limit-label">Five Hour Limit Remaining</div>
                    <div class="limit-sub">重置倒计时: ${countdown ? countdown : '已就绪'}</div>
                  </div>
                  <div class="limit-value-box">
                    <span class="limit-pct" style="color: ${color};">${pct}%</span>
                    <div class="ring-indicator" style="border-color: ${color};"></div>
                  </div>
                </div>
              </div>
            `;
          }
        }

        html += `
            <div class="card-footer">
              ${!isActive ? `<button class="btn-switch" onclick="switchAccount('${email}')">设为活跃</button>` : '<span style="color:var(--primary);font-size:11px;">● 当前主力</span>'}
              <button class="btn-card" onclick="deleteAccount('${email}')">移除账号</button>
            </div>
          </div>
        `;
      }
      html += '</div>';
      area.innerHTML = html;
    }

    // Google Modal 与 认证操作
    async function loadAuthUrl() {
      try {
        const res = await fetch("/quota/api/login-url");
        const data = await res.json();
        authUrl = data.login_url;
      } catch (e) {
        console.error("Failed to load auth URL", e);
      }
    }

    function openAddModal() {
      document.getElementById("addModal").classList.add("show");
    }

    function closeAddModal() {
      document.getElementById("addModal").classList.remove("show");
      document.getElementById("redirectUrlInput").value = "";
    }

    function openGoogleAuth() {
      if (!authUrl) {
        alert("授权地址加载中，请稍等...");
        return;
      }
      window.open(authUrl, "_blank");
    }

    async function submitAuthCode() {
      const url = document.getElementById("redirectUrlInput").value.trim();
      if (!url) {
        alert("请先粘贴跳转后的完整地址！");
        return;
      }

      const btn = document.getElementById("submitAuthBtn");
      btn.disabled = true;
      btn.innerText = "正在验证...";
      try {
        const res = await fetch("/quota/api/complete-login", {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify({url})
        });
        const data = await res.json();
        if (res.ok && data.success) {
          alert(data.message);
          closeAddModal();
          fetchGoogleData(true);
        } else {
          alert("绑定失败：" + (data.detail || JSON.stringify(data)));
        }
      } catch (err) {
        alert("网络请求异常：" + err.message);
      } finally {
        btn.disabled = false;
        btn.innerText = "完成绑定";
      }
    }

    async function deleteAccount(email) {
      if (!confirm(`确定要移除账号 ${email} 吗？`)) return;
      try {
        const res = await fetch(`/quota/api/accounts/${encodeURIComponent(email)}`, {method: "DELETE"});
        if (res.ok) {
          fetchGoogleData(true);
        } else {
          alert("移除失败");
        }
      } catch (e) {
        alert("操作异常：" + e.message);
      }
    }

    async function switchAccount(email) {
      try {
        const res = await fetch("/quota/api/accounts/switch", {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify({email})
        });
        if (res.ok) {
          fetchGoogleData(false);
        }
      } catch (e) {
        console.error("switch failed", e);
      }
    }

    window.addEventListener("DOMContentLoaded", () => {
      switchTab("codex");
      loadAuthUrl();
    });
  </script>
</body>
</html>
